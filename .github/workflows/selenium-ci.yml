name: 🧪 Selenium CI with Allure

on:
  push:
    branches: [ main, develop ]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "30 9 * * 1-5" # run at 4:30 PM (VNT), Monday to Friday

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run tests with Maven (ignore test failures)
        working-directory: ./WebCatalogAuto
        run: mvn clean test || true

      - name: Install Allure CLI (manual)
        run: |
          wget https://github.com/allure-framework/allure2/releases/download/2.29.0/allure-2.29.0.zip
          unzip allure-2.29.0.zip -d /opt/allure
          sudo ln -s /opt/allure/allure-2.29.0/bin/allure /usr/bin/allure

      - name: Generate Allure Report
        working-directory: ./WebCatalogAuto
        run: allure generate target/allure-results -o allure-report --clean

      - name: Upload Allure Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: WebCatalogAuto/allure-report

      - name: Deploy Allure report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./WebCatalogAuto/allure-report
